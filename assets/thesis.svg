nt-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" opacity="1.0" letter-spacing="0">Classical CAPM assumes beta is constant.</text><text x="52" y="164" font-size="34" font-weight="800" fill="#e2e8f0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">It isn't &#8212; and we can <tspan fill="#22d3ee">forecast when it breaks</tspan>.</text><text x="52.0" y="202.0" font-size="14.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" opacity="1.0" letter-spacing="0">Predict beta INSTABILITY, not beta. Rebalance only when instability is about to spike.</text><rect x="52" y="228" width="252" height="56" rx="10" fill="#22c55e" opacity=".10"/><rect x="52" y="228" width="3" height="56" rx="1.5" fill="#22c55e"/><text x="70.0" y="254.0" font-size="21" fill="#22c55e" text-anchor="start" font-weight="800" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" opacity="1.0" letter-spacing="0">−17.4%</text><text x="156.0" y="250.0" font-size="11.5" fill="#e2e8f0" text-anchor="start" font-weight="600" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" opacity="1.0" letter-spacing="0">max drawdown</text><text x="156.0" y="267.0" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" opacity="1.0" letter-spacing="0">index: −38.4%</text><rect x="324" y="228" width="252" height="56" rx="10" fill="#22c55e" opacity=".10"/><rect x="324" y="228" width="3" height="56" rx="1.5" fill="#22c55e"/><text x="342.0" y="254.0" font-size="21" fill="#22c55e" text-anchor="start" font-weight="800" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" opacity="1.0" le